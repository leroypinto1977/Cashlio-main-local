appId: com.cashlio.manager
productName: Cashlio Manager
directories:
  buildResources: build
files:
  # Naming any pattern here replaces the packager's default of everything, so
  # the default has to be said out loud before anything is added to it.
  - '**/*'
  # The database runtimes are delivered per platform by the extraResources
  # blocks below. Without this exclusion they ALSO get swept into the app
  # directory — both of them, on every platform — so a macOS build carried the
  # whole Windows PostgreSQL and codesign spent twenty minutes signing Windows
  # DLLs and several thousand timezone files into a macOS bundle.
  # @prisma/client is delivered outside the archive with the generated client
  # below, and must not also be inside it. The two require each other, and a
  # copy in the asar resolves '.prisma/client' to the one in Resources, which
  # then looks back for '@prisma/client/runtime' by walking up real
  # directories — a walk that never re-enters an asar. Both halves live on the
  # same side of that boundary or neither works.
  - '!node_modules/@prisma/client/**'
  - '!resources/postgres'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '!resources/postgres/**'
# The migrations travel with the app for every platform; the database itself is
# named per platform below, because ${platform} in a shared block resolves to
# the machine doing the building rather than the target — an Apple Silicon Mac
# quietly puts macOS binaries inside a Windows installer, and the failure only
# shows up on the first computer that is not the one that built it.
extraResources:
  # Prisma generates its client into node_modules/.prisma, a dot-directory
  # that is not a package in package.json — so the packager, which collects
  # node_modules by walking declared dependencies, never reaches it. The
  # result is an app that dies on its first line: @prisma/client is present,
  # and it immediately requires '.prisma/client/default', which is not.
  #
  # It cannot be added to `files` for the same reason. It goes here instead,
  # beside the archive rather than inside it, because Node resolves modules by
  # walking parent directories and that walk continues out of the asar into
  # Resources. The engine binaries are excluded: they are large, one per
  # platform, and ship separately below.
  - from: node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
      - '!*.node'
  # Its other half. See the exclusion in `files` above for why it cannot stay
  # in the archive once the generated client has left it.
  - from: node_modules/@prisma/client
    to: node_modules/@prisma/client
    filter:
      - '**/*'
  - from: prisma/migrations
    to: prisma/migrations
    filter:
      - '**/*.sql'
  # Prisma's query engine is a native binary that Node cannot dlopen from
  # inside an asar, so it ships as a plain resource. It is named per platform
  # in the win/mac blocks below: a build carries an engine for every target in
  # binaryTargets, and shipping all of them means the Windows app finds the
  # macOS dylib first and refuses to start.
win:
  executableName: main-local
  extraResources:
    - from: resources/postgres/win32
      to: postgres
      filter:
        - '**/*'
    - from: node_modules/.prisma/client
      to: prisma-engine
      filter:
        - 'query_engine-windows*.node'
        - 'schema.prisma'
  # x64 explicitly. electron-builder otherwise builds for whatever the machine
  # doing the building happens to be — an Apple Silicon Mac produces an arm64
  # Windows installer, which is not what is on a shop counter, and which would
  # not match the x64 PostgreSQL bundled beside it.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Installs the Visual C++ runtime the bundled PostgreSQL links against. See
  # build/installer.nsh — without it the database will not start on a machine
  # that has never had it, which a clean Windows install has not.
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  extraResources:
    - from: resources/postgres/darwin
      to: postgres
      filter:
        - '**/*'
    - from: node_modules/.prisma/client
      to: prisma-engine
      filter:
        - 'libquery_engine-darwin*.node'
        - 'schema.prisma'
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist
  # This build is not notarised — there is no Apple Developer identity behind
  # it — so the hardened runtime buys nothing and costs a great deal: it
  # refuses to load the PostgreSQL libraries the app ships with, and signing
  # 140 MB of database binaries produced a seal that did not match the bundle,
  # which macOS reports as "code has no resources but signature indicates they
  # must be present" and shows the user as an app that opens no window at all.
  # Apple Silicon refuses to run an unsigned binary at all, so the build is
  # ad-hoc signed (electron-builder's default when no Developer ID is present).
  # The hardened runtime stays off: without notarisation it adds nothing, and
  # it refuses to load the PostgreSQL libraries the app ships with.
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
